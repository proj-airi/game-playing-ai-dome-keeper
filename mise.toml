min_version = "2026.6.0"

[settings]
activate_aggressive = true
lockfile = true

[tools]
node = "24.18.0"
pnpm = "11.21.0"
python = "3.12.13"
"github:microsoft/apm" = "0.31.0"
"aqua:astral-sh/uv" = "0.11.32"

[tool_alias]
godotdome = "github:DomeKeeperMods/Docs"

[env]
DOMEKEEPER_VERSION = "5.0.5.19"
GODOT_BIN = { value = "{% if os() == 'macos' %}{{ tools.godotdome.path }}/macos_tools.app/Contents/MacOS/Godot{% elif os() == 'linux' %}{{ tools.godotdome.path }}/linux/godot.linux.editor.x86_64{% elif os() == 'windows' %}{{ tools.godotdome.path }}/windows/godot.windows.editor.x86_64.exe{% endif %}", tools = true }
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[tools.godotdome]
version = "5.1"
os = ["macos", "linux/x64", "windows/x64"]

[tools.godotdome.platforms]
macos-arm64 = { asset_pattern = "godot.macos.editor.zip", bin_path = "macos_tools.app/Contents/MacOS", checksum = "sha256:ac8c975c6cb261132c9860ccf20415e11aa51ee2df1829d7c140a6a9cb425e46", size = "168284459" }
macos-x64 = { asset_pattern = "godot.macos.editor.zip", bin_path = "macos_tools.app/Contents/MacOS", checksum = "sha256:ac8c975c6cb261132c9860ccf20415e11aa51ee2df1829d7c140a6a9cb425e46", size = "168284459" }
linux-x64 = { asset_pattern = "linux.zip", bin_path = "linux", checksum = "sha256:9a31fd18199dca76ef0b24f46f97220ba956628f36ea0e0780ba54bf46b113b8", size = "77595144" }
windows-x64 = { asset_pattern = "windows.zip", bin_path = "windows", checksum = "sha256:d446c93864d03275f370e06ab83d3b9082ecc8e1710c32aaf42f307e7b4c5f98", size = "65248131" }

[tasks.setup]
description = "Install locked project dependencies and Agent skills"
run = [
  "pnpm install --frozen-lockfile",
  "uv sync --locked",
  "apm install --frozen",
]

[tasks.lint]
description = "Lint the repository"
run = "pnpm run lint"

[tasks.alint]
description = "Run model-assisted JavaScript and TypeScript review"
run = "pnpm run alint"

[tasks."agents:check"]
description = "Verify locked Agent skills and deployed files"
run = "apm audit --ci"

[tasks.typecheck]
description = "Type-check the repository"
run = "pnpm run typecheck"

[tasks.check]
description = "Run repository checks"
depends = [
  "agents:check",
  "domekeeper:vidot:test",
  "godot:check",
  "lint",
  "lower-v0:test",
  "typecheck",
]

[tasks."lower-v0:collect"]
description = "Collect seeded random Lower v0 task Sessions"
env = { LOWER_V0_DATASET_DIR = "{{ config_root }}/data/lower-v0", LOWER_V0_COUNT = "8", LOWER_V0_SEED = "20260909", VIDOT_MOVIE = "{{ config_root }}/recordings/lower-v0.avi" }
run = [
  "pnpm --dir mods/LemonNekoGH-DataCollectorAI run test",
  'uv run --locked --package lower-v0 lower-v0 extract --data "$LOWER_V0_DATASET_DIR" --movie "$VIDOT_MOVIE"',
]

[tasks."lower-v0:test"]
run = "uv run --locked --package lower-v0 python -m unittest discover -s models/lower-v0 -p 'test_*.py'"

[tasks."lower-v0:check-dataset"]
run = "uv run --locked --package lower-v0 lower-v0 check"

[tasks."lower-v0:train"]
run = "uv run --locked --package lower-v0 lower-v0 train"

[tasks."lower-v0:evaluate"]
run = "uv run --locked --package lower-v0 lower-v0 evaluate"

[tasks."data-collector-ai:build"]
description = "Build the TypeScript-authored DataCollectorAI Mod"
run = "pnpm --dir mods/LemonNekoGH-DataCollectorAI run build"

[tasks."domekeeper:vidot:test"]
description = "Run the DataCollectorAI Move test inside Dome Keeper"
run = "pnpm --dir mods/LemonNekoGH-DataCollectorAI run test"

[tasks."domekeeper:vidot:record"]
description = "Record the DataCollectorAI Move test with Godot Movie Maker"
env = { VIDOT_MOVIE = "{{ config_root }}/recordings/move.avi" }
run = "pnpm --dir mods/LemonNekoGH-DataCollectorAI run test"

[tasks.decompile]
description = "Decompile Dome Keeper and link repository mods"
depends = ["data-collector-ai:build"]
run = "node scripts/decompile-domekeeper.ts"

[tasks."godot:open"]
description = "Open the decompiled project in Godot"
depends = ["godot:check"]
run = "\"{{ env.GODOT_BIN }}\" ./external/domekeeper-decompiled/$DOMEKEEPER_VERSION/project.godot"

[tasks."godot:check"]
description = "Check that repository mods load in an isolated headless game"
depends = ["data-collector-ai:build"]
run = "node scripts/check-domekeeper-mod.ts"

[tasks.train]
description = "Train an Ultralytics detection model"
run = "uv run --locked yolo detect train"
