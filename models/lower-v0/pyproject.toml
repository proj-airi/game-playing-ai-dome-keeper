[project]
name = "lower-v0"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.14,<2.15",
  "torchvision>=0.29,<0.30",
  "pillow>=12,<13",
  "pydantic>=2,<3",
  "onnx>=1.22,<1.23",
  "onnxscript>=0.7.2,<0.8",
]

[project.scripts]
lower-v0 = "lower_v0:main"

[build-system]
requires = [ "setuptools>=77" ]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "lower_v0",
  "session_schema"
]
